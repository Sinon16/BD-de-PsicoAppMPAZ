spring.application.name=BD-de-PsicoAppMPAZ

# Servidor y Puerto
server.port=8080

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:psicodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# CRUCIAL: Esperar a que JPA cree el esquema de tablas antes de ejecutar data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always